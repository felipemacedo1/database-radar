name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Database Radar
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Compile the Java 8 demo
        run: ./mvnw --batch-mode --no-transfer-progress -f demo-legacy-java8/pom.xml clean verify
      - name: Exercise the SQL Server-first demo CLI
        run: |
          java -jar cli/target/database-radar.jar scan demo-legacy-java8 --sql-dialect sql-server
          java -jar cli/target/database-radar.jar writers PEDIDO.STATUS
          java -jar cli/target/database-radar.jar readers PEDIDO.STATUS
          java -jar cli/target/database-radar.jar impact column PEDIDO.STATUS
